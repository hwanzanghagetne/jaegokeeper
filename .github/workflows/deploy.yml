name: Deploy to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'compose*.yaml'
      - 'scripts/deploy_docker.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/jaegokeeper-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Test
        run: mvn -B test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::739754704259:role/jaegokeeper-github-deploy-role
          aws-region: ap-northeast-2
          allowed-account-ids: 739754704259
          role-session-name: jaegokeeper-${{ github.run_id }}

      - name: Deploy through SSM
        env:
          INSTANCE_ID: i-0f7438b7e60e43291
        run: |
          set -euo pipefail

          SCRIPT_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/deploy_docker.sh"
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

          PARAMETERS="$(jq -n \
            --arg script_url "${SCRIPT_URL}" \
            --arg sha "${GITHUB_SHA}" \
            --arg image "${IMAGE}" \
            '{commands: [
              "set -eu",
              ("curl -fsSL " + ($script_url | @sh) + " -o /tmp/jaegokeeper-deploy.sh"),
              "chown ubuntu:ubuntu /tmp/jaegokeeper-deploy.sh",
              "chmod 700 /tmp/jaegokeeper-deploy.sh",
              ("sudo -u ubuntu -H /tmp/jaegokeeper-deploy.sh " + ($sha | @sh) + " " + ($image | @sh))
            ]}')"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Jaegokeeper ${GITHUB_SHA}" \
            --parameters "${PARAMETERS}" \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command: ${COMMAND_ID}"

          STATUS="Pending"
          for _ in {1..60}; do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query Status \
              --output text 2>/dev/null || true)"

            case "${STATUS}" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac

            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}'

          test "${STATUS}" = "Success"
