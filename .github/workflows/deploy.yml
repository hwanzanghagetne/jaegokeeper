name: Deploy to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'compose*.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/jaegokeeper-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Test
        run: mvn -B test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main

      - name: Copy Docker Compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "compose.prod.yaml"
          target: "/tmp"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            APP_DIR="/opt/jaegokeeper"
            COMPOSE_FILE="${APP_DIR}/compose.prod.yaml"
            NEW_IMAGE="ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
            HEALTHCHECK_URL="http://127.0.0.1:8080/"

            test -f "/tmp/compose.prod.yaml"
            test -f "${APP_DIR}/.env"
            install -m 600 "/tmp/compose.prod.yaml" "${COMPOSE_FILE}"

            PREVIOUS_IMAGE="$(docker inspect --format '{{.Config.Image}}' jaegokeeper-backend 2>/dev/null || true)"

            # 1GB EC2에서 두 Tomcat을 동시에 실행하지 않는다.
            sudo systemctl stop tomcat10

            cd "${APP_DIR}"
            export BACKEND_IMAGE="${NEW_IMAGE}"
            export BACKEND_PORT=8080

            docker compose -f "${COMPOSE_FILE}" pull

            if docker compose -f "${COMPOSE_FILE}" up -d --force-recreate --wait --wait-timeout 90 \
              && curl -fsS "${HEALTHCHECK_URL}" > /dev/null; then
              echo "Deploy succeeded: ${NEW_IMAGE}"
              docker image prune -f > /dev/null
              exit 0
            fi

            echo "Deploy failed. Starting rollback..."

            if [[ -n "${PREVIOUS_IMAGE}" ]]; then
              export BACKEND_IMAGE="${PREVIOUS_IMAGE}"
              if docker compose -f "${COMPOSE_FILE}" up -d --force-recreate --wait --wait-timeout 90 \
                && curl -fsS "${HEALTHCHECK_URL}" > /dev/null; then
                echo "Docker rollback succeeded: ${PREVIOUS_IMAGE}"
                exit 1
              fi
            fi

            echo "Docker rollback failed"
            exit 1
