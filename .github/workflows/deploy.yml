name: Deploy to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Test
        run: mvn -B test

      - name: Build WAR
        run: mvn -B clean package -DskipTests

      - name: Copy WAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/JaegoKeeper.war"
          target: "/tmp"
          strip_components: 1

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            TOMCAT_HOME="/opt/tomcat10"
            WAR_PATH="/tmp/JaegoKeeper.war"
            ROOT_WAR="${TOMCAT_HOME}/webapps/ROOT.war"
            ROOT_DIR="${TOMCAT_HOME}/webapps/ROOT"
            BACKUP_WAR="/tmp/ROOT.war.bak.$(date +%Y%m%d_%H%M%S)"
            HEALTHCHECK_URL="http://127.0.0.1:8080/"

            test -f "${WAR_PATH}"

            if [[ -f "${ROOT_WAR}" ]]; then
              cp "${ROOT_WAR}" "${BACKUP_WAR}"
            fi

            sudo systemctl stop tomcat10

            rm -rf "${ROOT_DIR}"
            cp "${WAR_PATH}" "${ROOT_WAR}"

            sudo systemctl start tomcat10

            for i in $(seq 1 40); do
              if curl -fsS "${HEALTHCHECK_URL}" > /dev/null 2>&1; then
                echo "Health check OK: ${HEALTHCHECK_URL}"
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed, rolling back..."
            if [[ -f "${BACKUP_WAR}" ]]; then
              sudo systemctl stop tomcat10
              cp "${BACKUP_WAR}" "${ROOT_WAR}"
              sudo systemctl start tomcat10
            fi
            exit 1
